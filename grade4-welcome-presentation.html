<style>
/* 
   ==========================================================================
   لوحة الألوان الأربعة الموحدة (Strict 4-Color Palette)
   1. اللون الأساسي (Primary): البنفسجي النيلي #4f46e5 (Indigo)
   2. لون النجاح/التمييز (Success/Accent): الأخضر الزمردي #10b981 (Emerald)
   3. لون التنبيه/الخطأ (Danger): الأحمر الوردي #f43f5e (Rose)
   4. الألوان المحايدة (Neutrals): Slate (#1e293b, #f8fafc) وخلفيات الأبيض والأسود
   ==========================================================================
*/
:root {
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --accent: #10b981;
    --danger: #f43f5e;
    --bg: #0f172a;
    --bg-card: #1e293b;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
    --radius: 16px;
    --radius-sm: 10px;
    --tr: .25s ease
}
[data-theme=light] {
    --bg: #f8fafc;
    --bg-card: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
}

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0
}
body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    transition: background var(--tr), color var(--tr);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* TOPBAR */
.topbar {
    background: rgba(30,41,59,.9);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100
}
[data-theme=light] .topbar {
    background: rgba(255,255,255,.88);
}
.back-btn-top {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    transition: var(--tr)
}
.back-btn-top:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary)
}
.tlogo {
    font-size: 20px;
    font-weight: 900;
    color: var(--primary);
    font-family: 'Outfit', sans-serif
}
.tlogo span {
    color: var(--accent)
}
.theme-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 2px solid var(--border);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    transition: var(--tr)
}

.main-wrap {
    flex: 1;
    max-width: 980px;
    width: 100%;
    margin: 25px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
}

/* LESSON SELECTOR */
.lesson-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    overflow-x: auto;
    padding-bottom: 8px
}
.l-btn {
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 2px solid var(--border);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--tr)
}
.l-btn:hover {
    border-color: var(--primary);
    color: var(--text)
}
.l-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff
}

/* PRESENTATION SCREEN */
.presentation-stage {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 45px 35px;
    min-height: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.slide-badge {
    position: absolute;
    top: 20px;
    right: 25px;
    background: rgba(79, 70, 229, 0.15);
    border: 1px solid var(--primary-light);
    color: var(--primary-light);
    font-size: 13px;
    font-weight: 800;
    padding: 4px 14px;
    border-radius: 100px;
}

.slide-emoji {
    font-size: 55px;
    margin-bottom: 12px;
}

.slide-title {
    font-size: 28px;
    font-weight: 900;
    color: #38bdf8;
    margin-bottom: 12px;
    font-family: 'Outfit', 'Tajawal', sans-serif;
}
.slide-subtitle {
    font-size: 20px;
    color: var(--text);
    font-weight: 700;
    margin-bottom: 10px;
    font-family: 'Outfit', sans-serif;
}
.slide-ar-text {
    font-size: 18px;
    color: var(--text-muted);
    font-weight: 600;
    max-width: 750px;
    line-height: 1.8;
}

.slide-quiz-box {
    background: rgba(0,0,0,0.15);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 20px;
    width: 100%;
    max-width: 650px;
    margin-top: 15px;
}
.quiz-opt-btn {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    margin-top: 10px;
    cursor: pointer;
    transition: var(--tr);
    text-align: right;
}
.quiz-opt-btn:hover { border-color: var(--primary); }
.quiz-opt-btn.correct { background: rgba(16,185,129,0.2) !important; border-color: var(--accent) !important; color: #34d399 !important; }
.quiz-opt-btn.wrong { background: rgba(244,63,94,0.2) !important; border-color: var(--danger) !important; color: #fb7185 !important; }

/* CONTROLS BAR */
.controls-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    flex-wrap: wrap;
    gap: 12px;
}
.nav-btns {
    display: flex;
    gap: 10px;
}
.btn-nav {
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 2px solid var(--border);
    color: var(--text);
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: var(--tr);
}
.btn-nav:hover:not(:disabled) {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary)
}
.btn-nav:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.btn-export-pptx {
    padding: 10px 22px;
    border-radius: var(--radius-sm);
    background: #ea580c;
    border: none;
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: var(--tr)
}
.btn-export-pptx:hover { background: #c2410c; }
.btn-speak {
    background: rgba(79, 70, 229, 0.2);
    border: 1px solid var(--primary-light);
    color: #a5b4fc;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    margin-top: 10px;
}
</style>
</head>

            { type: "Warmup", badge: "شريحة ٢: التمهيد", emoji: "🧠", title: "Past Stories Warm-up", subtitle: "Where were you yesterday?", arabic: "أين كنت بالأمس؟", speech: "Where were you yesterday?" },
            { type: "Content", badge: "شريحة ٣: قصة الاحتفال", emoji: "🍰", title: "Sunday was Celebration Day!", subtitle: "was / wasn't (Singular) & were / weren't (Plural)", arabic: "قاعدة المفرد والجمع في زمن الماضي البسيط", speech: "Sunday was the celebration day! The food was delicious." },
            { type: "Quiz", badge: "شريحة ٤: التحقق", emoji: "❓", title: "Concept Check", subtitle: "The chocolate cake ______ delicious!", arabic: "كعكة الشوكولاتة ______ لذيذة:", options: [{ text: "A) was (Correct)", correct: true }, { text: "B) were", correct: false }], speech: "The chocolate cake was delicious." },
            { type: "Game", badge: "شريحة ٥: لعبة الفصل", emoji: "🎮", title: "Was vs Were Fast Slam", subtitle: "Slam the buzzer: Was or Were?", arabic: "تحدي السرعة: اختر was أم were للجملة!", speech: "Was or Were fast slam game!" }
        ]
    }
};

let currentLessonNum = 1;
let currentSlideIndex = 0;

function loadLesson(lNum, btn) {
    currentLessonNum = lNum;
    currentSlideIndex = 0;
    if(btn) {
        document.querySelectorAll('.l-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    renderSlide();
}

function renderSlide() {
    const lData = lessons[currentLessonNum];
    const sData = lData.slides[currentSlideIndex];

    document.getElementById('slide-type-badge').innerText = sData.badge;
    document.getElementById('slide-emoji').innerText = sData.emoji;
    document.getElementById('slide-title').innerText = sData.title;
    document.getElementById('slide-sub').innerText = sData.subtitle;
    document.getElementById('slide-ar').innerText = sData.arabic;

    const extraBox = document.getElementById('slide-extra');
    extraBox.innerHTML = '';

    if(sData.type === 'Quiz' && sData.options) {
        const qBox = document.createElement('div');
        qBox.className = 'slide-quiz-box';
        sData.options.forEach(opt => {
            const optBtn = document.createElement('button');
            optBtn.className = 'quiz-opt-btn';
            optBtn.innerText = opt.text;
            optBtn.onclick = function() {
                qBox.querySelectorAll('.quiz-opt-btn').forEach(b => b.classList.remove('correct', 'wrong'));
                if(opt.correct) {
                    optBtn.classList.add('correct');
                    speak('Correct! Excellent job.');
                } else {
                    optBtn.classList.add('wrong');
                    speak('Try again.');
                }
            };
            qBox.appendChild(optBtn);
        });
        extraBox.appendChild(qBox);
    }

    document.getElementById('slide-indicator').innerText = `الشريحة ${currentSlideIndex + 1} من ${lData.slides.length}`;
    document.getElementById('btn-prev').disabled = currentSlideIndex === 0;
    document.getElementById('btn-next').disabled = currentSlideIndex === lData.slides.length - 1;
}

function nextSlide() {
    const lData = lessons[currentLessonNum];
    if(currentSlideIndex < lData.slides.length - 1) {
        currentSlideIndex++;
        renderSlide();
    }
}

function prevSlide() {
    if(currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlide();
    }
}

function speakCurrentSlide() {
    const sData = lessons[currentLessonNum].slides[currentSlideIndex];
    speak(sData.speech || sData.title);
}

function speak(txt) {
    if('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(txt);
        utter.lang = 'en-US';
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
    }
}

function tglTheme() {
    const doc = document.documentElement;
    doc.setAttribute('data-theme', doc.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

function exportPPTX() {
    const pptx = new PptxGenJS();
    pptx.layout = 'LAYOUT_16x9';
    const lData = lessons[currentLessonNum];

    lData.slides.forEach(s => {
        const slide = pptx.addSlide();
        slide.background = { fill: '1e293b' };
        slide.addText("SmartLearning Classroom", { x: 0.5, y: 0.3, width: 9.0, height: 0.4, fontSize: 12, bold: true, color: '64748b' });
        slide.addText(s.emoji, { x: 0.5, y: 0.9, width: 9.0, height: 1.0, fontSize: 44, align: 'center' });
        slide.addText(s.title, { x: 0.5, y: 2.0, width: 9.0, height: 0.8, fontSize: 26, bold: true, color: '38bdf8', align: 'center' });
        slide.addText(s.subtitle, { x: 0.5, y: 2.9, width: 9.0, height: 0.9, fontSize: 18, color: 'f1f5f9', align: 'center' });
        slide.addText(s.arabic, { x: 0.5, y: 4.0, width: 9.0, height: 0.8, fontSize: 16, color: '94a3b8', align: 'center' });
    });

    pptx.writeFile({ fileName: `Grade4_Welcome_${lData.title}.pptx` });
}

renderSlide();
</script>
