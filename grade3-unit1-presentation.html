/* 
   ==========================================================================
   لوحة الألوان الأربعة الموحدة (Strict 4-Color Palette)
   1. اللون الأساسي (Primary): البنفسجي النيلي #4f46e5 (Indigo)
   2. لون النجاح/التمييز (Success/Accent): الأخضر الزمردي #10b981 (Emerald)

*/
:root {
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --accent: #10b981;
    --danger: #f43f5e;
    --bg: #f8fafc;

    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --radius: 16px;
    --radius-sm: 10px;
    --tr: .25s ease
}
[data-theme=dark] {
    --bg: #0f172a;
    --bg-card: #1e293b;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155
}

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0
}
body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    transition: background var(--tr), color var(--tr);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* TOPBAR */
.topbar {
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100
}
[data-theme=dark] .topbar {

}
.back-btn-top {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    transition: var(--tr)
}
.back-btn-top:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary)
}

.main-wrap {
    flex: 1;
    max-width: 960px;
    width: 100%;
    margin: 30px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    justify-content: center
}

/* PLAY AREA */
.presentation-container {
    background: #1e293b;
    border: 4px solid var(--primary);
    border-radius: var(--radius);
    aspect-ratio: 16 / 9;
    width: 100%;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    text-align: center;
    transition: var(--tr)
}
.slide-watermark {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 14px;
    font-weight: 800;
    color: var(--accent);
}
.slide-emoji {
    font-size: 80px;
    margin-bottom: 20px;
    animation: bounce 2s infinite
}
@keyframes bounce {
    0%, 100% { transform: translateY(0) }
    50% { transform: translateY(-10px) }
}
.slide-title {
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 12px;
    font-family: 'Outfit', sans-serif;
}
.slide-subtitle {
    font-size: 18px;
    color: #94a3b8;
    margin-bottom: 24px;
    max-width: 80%
}
.slide-eng-box {
    background: #273549;
    padding: 20px 30px;
    border-radius: var(--radius-sm);
    font-size: 26px;
    font-weight: 800;
    color: #f1f5f9;
    border-left: 5px solid var(--accent);
    margin-bottom: 20px;
    font-family: 'Outfit', sans-serif;
    direction: ltr
}
.slide-ar-text {
    font-size: 20px;
    color: #38bdf8;
    font-weight: 700
}

/* PLAYER CONTROLS */
.player-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px 24px;
    box-shadow: var(--shadow)
}
.slide-indicator {
    font-weight: 800;
    color: var(--text);
    font-size: 16px
}
.btn-control {
    padding: 10px 20px;
    background: var(--primary);
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: none;
    transition: var(--tr)
}
.btn-control:hover {
    background: var(--primary-light)
}
.btn-control:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed
}

    border: 2px solid var(--border);
    background: var(--bg-card);
    color: var(--text);

let currentLesson = 1;
let currentSlideIdx = 0;

function renderSlide() {
    const lesson = lessonsData[currentLesson];
    const slideData = lesson.slides[currentSlideIdx];
    const screen = document.getElementById('slide-screen');
    const ind = document.getElementById('slide-ind');
    
    ind.textContent = `شريحة ${currentSlideIdx + 1} / ${lesson.slides.length}`;
    
    document.getElementById('prev-btn').disabled = currentSlideIdx === 0;
    document.getElementById('next-btn').disabled = currentSlideIdx === lesson.slides.length - 1;

    let inner = `<div class="slide-watermark">Smart.Learning Classroom</div>`;
    inner += `<div class="slide-emoji">${slideData.emoji}</div>`;
    inner += `<div class="slide-title">${slideData.title}</div>`;
    
    if (slideData.type === "title") {
        inner += `<div class="slide-subtitle">${slideData.subtitle}</div>`;
    } else {
        if(slideData.english) {
            inner += `<div class="slide-eng-box">${slideData.english}</div>`;
        }
    }
    
    inner += `<div class="slide-ar-text">${slideData.arabic}</div>`;
    screen.innerHTML = inner;
}

function nextSlide() {
    const lesson = lessonsData[currentLesson];
    if (currentSlideIdx < lesson.slides.length - 1) {
        currentSlideIdx++;
        renderSlide();
    }
}

function prevSlide() {
    if (currentSlideIdx > 0) {
        currentSlideIdx--;
        renderSlide();
    }
}

function changeLesson(val) {
    currentLesson = val;
    currentSlideIdx = 0;
    renderSlide();
}

window.onload = () => {
    renderSlide();
};

/* DOWNLOAD DYNAMIC POWERPOINT */
function triggerPPTXDownload() {
    let pptx = new PptxGenJS();
    const lesson = lessonsData[currentLesson];
    
    pptx.layout = 'LAYOUT_16x9';
    
    lesson.slides.forEach((slideData) => {
        let slide = pptx.addSlide();
        slide.background = { fill: "1E293B" };
        
        slide.addText("Smart.Learning Classroom Slides", { x: 0.5, y: 0.3, w: 9, h: 0.5, fontSize: 14, color: "10B981", bold: true });
        
        if (slideData.type === "title") {
            slide.addText(slideData.emoji, { x: 0.5, y: 1.8, w: 12.3, h: 1.2, fontSize: 72, align: "center" });

        } else {

            if (slideData.english) {

        }
