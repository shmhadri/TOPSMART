<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشغل عرض PowerPoint المطور - الصف الرابع الابتدائي | SmartLearning</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* 
   ==========================================================================
   لوحة الألوان الأربعة الموحدة (Strict 4-Color Palette)
   1. اللون الأساسي (Primary): البنفسجي النيلي #4f46e5 (Indigo)
   2. لون النجاح/التمييز (Success/Accent): الأخضر الزمردي #10b981 (Emerald)
   3. لون التنبيه/الخطأ (Danger): الأحمر الوردي #f43f5e (Rose)
   4. الألوان المحايدة (Neutrals): Slate (#1e293b, #f8fafc) وخلفيات الأبيض والأسود
   ==========================================================================
*/
:root {
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --accent: #10b981;
    --danger: #f43f5e;
    --bg: #0f172a;
    --bg-card: #1e293b;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
    --radius: 16px;
    --radius-sm: 10px;
    --tr: .25s ease
}
[data-theme=light] {
    --bg: #f8fafc;
    --bg-card: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
}

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0
}
body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    transition: background var(--tr), color var(--tr);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* TOPBAR */
.topbar {
    background: rgba(30,41,59,.9);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100
}
[data-theme=light] .topbar {
    background: rgba(255,255,255,.88);
}
.back-btn-top {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    transition: var(--tr)
}
.back-btn-top:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary)
}
.tlogo {
    font-size: 22px;
    font-weight: 900;
    color: var(--primary)
}
.tlogo span {
    color: var(--accent)
}
.theme-btn {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border);
    background: var(--bg-card);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--tr);
    cursor: pointer;
}
.theme-btn:hover {
    border-color: var(--primary);
    color: var(--primary)
}

.main-wrap {
    flex: 1;
    max-width: 960px;
    width: 100%;
    margin: 30px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* SLIDE PLAYER CONTROLS */
.controls-card {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.02);
}
.lesson-selector {
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    outline: none;
    cursor: pointer;
}

/* THE SLIDE SCREEN */
.slide-screen {
    background: #1e293b;
    border-radius: var(--radius);
    aspect-ratio: 16 / 9;
    width: 100%;
    position: relative;
    overflow: hidden;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    border: 5px solid #334155;
    text-align: center;
}
.slide-watermark {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 13px;
    font-weight: 800;
    opacity: 0.25;
    letter-spacing: 1px;
}
.slide-emoji {
    font-size: 64px;
    margin-bottom: 15px;
}
.slide-title {
    font-size: 32px;
    font-weight: 800;
    color: #38bdf8;
    margin-bottom: 15px;
    font-family: 'Outfit', 'Tajawal', sans-serif;
}
.slide-subtitle {
    font-size: 20px;
    opacity: 0.8;
    max-width: 80%;
    line-height: 1.5;
}
.slide-eng-box {
    background: rgba(255,255,255,0.06);
    border-left: 4px solid #38bdf8;
    padding: 15px 25px;
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 24px;
    font-weight: bold;
    margin: 15px 0;
    color: #f1f5f9;
}
.slide-ar-text {
    font-size: 18px;
    color: #94a3b8;
    font-weight: 700;
}

/* INTERACTIVE SLIDE OPTIONS (For Slide 4: Concept Check) */
.slide-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 500px;
    margin-top: 15px;
}
.slide-option-btn {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    padding: 12px;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--tr);
}
.slide-option-btn:hover {
    background: rgba(255,255,255,0.15);
    border-color: #38bdf8;
}
.slide-option-btn.correct {
    background: rgba(16, 185, 129, 0.2);
    border-color: var(--accent);
}
.slide-option-btn.wrong {
    background: rgba(244, 63, 94, 0.2);
    border-color: var(--danger);
}

/* PLAYER ACTIONS */
.player-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.nav-btn {
    background: var(--primary);
    color: #fff;
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    transition: var(--tr);
    border: none;
}
.nav-btn:hover:not(:disabled) {
    background: var(--primary-light);
}
.nav-btn:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
}
.slide-indicator {
    font-size: 16px;
    font-weight: 800;
    color: var(--text-muted);
}
.export-btn {
    background: #10b981;
    color: #fff;
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    transition: var(--tr);
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.export-btn:hover {
    background: #059669;
}
</style>

let currentLesson = 1;
let currentSlideIdx = 0;

function loadLesson(lNum) {
    currentLesson = lNum;
    currentSlideIdx = 0;
    renderSlide();
}

function speak(txt) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'en-US';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
    }
}

function renderSlide() {
    const lesson = lessonsData[currentLesson];
    const slideData = lesson.slides[currentSlideIdx];
    const screen = document.getElementById('slide-screen');
    const ind = document.getElementById('slide-ind');
    
    ind.textContent = `الشريحة ${currentSlideIdx + 1} / ${lesson.slides.length}`;
    document.getElementById('prev-btn').disabled = currentSlideIdx === 0;
    document.getElementById('next-btn').disabled = currentSlideIdx === lesson.slides.length - 1;
    
    let inner = `<div class="slide-watermark">Smart.Learning Classroom</div>`;
    inner += `<div class="slide-emoji">${slideData.emoji}</div>`;
    inner += `<div class="slide-title">${slideData.title}</div>`;
    
    if (slideData.type === "title") {
        inner += `<div class="slide-subtitle">${slideData.subtitle}</div>`;
        inner += `<div class="slide-ar-text" style="margin-top:15px;">${slideData.arabic}</div>`;
    } else if (slideData.type === "quiz") {
        inner += `<div style="font-size:20px; font-weight:bold; margin-bottom:15px; color:#f1f5f9;">${slideData.question}</div>`;
        inner += `<div class="slide-options">`;
        slideData.options.forEach((opt, index) => {
            inner += `<button class="slide-option-btn" onclick="checkQuizSlide(this, ${opt.isCorrect})">${opt.text}</button>`;
        });
        inner += `</div>`;
    } else {
        if(slideData.english) {
            inner += `<div class="slide-eng-box" onclick="speak('${slideData.english.replace(/'/g, "\\'")}')" style="cursor:pointer;">${slideData.english.replace(/\n/g, '<br>')} 🔊</div>`;
        }
        inner += `<div class="slide-ar-text">${slideData.arabic}</div>`;
    }
    
    screen.innerHTML = inner;
}

function checkQuizSlide(btn, isCorrect) {
    const parent = btn.parentElement;
    parent.querySelectorAll('.slide-option-btn').forEach(b => b.className = 'slide-option-btn');
    if (isCorrect) {
        btn.classList.add('correct');
        speak('Well done! That is correct.');
    } else {
        btn.classList.add('wrong');
        speak('Try again!');
    }
}

function nextSlide() {
    const lesson = lessonsData[currentLesson];
    if (currentSlideIdx < lesson.slides.length - 1) {
        currentSlideIdx++;
        renderSlide();
    }
}

function prevSlide() {
    if (currentSlideIdx > 0) {
        currentSlideIdx--;
        renderSlide();
    }
}

// Powerpoint pptx generation using PptxGenJS
function triggerPPTXDownload() {
    const pptx = new PptxGenJS();
    pptx.layout = 'LAYOUT_16x9';
    
    const lesson = lessonsData[currentLesson];
    
    lesson.slides.forEach((s) => {
        const slide = pptx.addSlide();
        // Background color (Dark theme matching layout)
        slide.background = { fill: '1e293b' };
        
        // Watermark/Header
        slide.addText("Smart.Learning Classroom", {
            x: 0.5, y: 0.3, width: 9.0, height: 0.4,
            fontSize: 12, bold: true, color: '64748b'
        });
        
        // Emoji
        slide.addText(s.emoji, {
            x: 0.5, y: 1.0, width: 9.0, height: 1.0,
            fontSize: 48, align: 'center'
        });
        
        // Slide title
        slide.addText(s.title, {
            x: 0.5, y: 2.2, width: 9.0, height: 0.8,
            fontSize: 28, bold: true, color: '38bdf8', align: 'center'
        });
        
        if (s.type === 'title') {
            slide.addText(s.subtitle, {
                x: 0.5, y: 3.2, width: 9.0, height: 0.6,
                fontSize: 18, color: 'f1f5f9', align: 'center'
            });
            slide.addText(s.arabic, {
                x: 0.5, y: 4.0, width: 9.0, height: 0.6,
                fontSize: 16, color: '94a3b8', align: 'center'
            });
        } else if (s.type === 'quiz') {
            slide.addText(s.question, {
                x: 0.5, y: 3.2, width: 9.0, height: 0.8,
                fontSize: 20, bold: true, color: 'ffffff', align: 'center'
            });
            let optionsText = "";
            s.options.forEach(opt => {
                optionsText += opt.text + "\n";
            });
            slide.addText(optionsText, {
                x: 1.0, y: 4.2, width: 8.0, height: 1.5,
                fontSize: 16, color: 'f1f5f9', align: 'center'
            });
        } else {
            if (s.english) {
                slide.addText(s.english, {
                    x: 0.5, y: 3.2, width: 9.0, height: 1.2,
                    fontSize: 20, bold: true, color: 'f1f5f9', align: 'center'
                });
            }
            slide.addText(s.arabic, {
                x: 0.5, y: 4.6, width: 9.0, height: 0.8,
                fontSize: 16, color: '94a3b8', align: 'center'
            });
        }
    });
    
    pptx.writeFile({ fileName: `Grade4_Unit1_${lesson.title.replace(/\s+/g, '_')}` });
}

// Initial Load
loadLesson(1);
</script>
</body>
</html>
