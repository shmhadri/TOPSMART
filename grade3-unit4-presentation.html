<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض PowerPoint التفاعلي - الوحدة 4: Chores | SmartLearning</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* 
   ==========================================================================
   لوحة الألوان الأربعة الموحدة (Strict 4-Color Palette)
   1. اللون الأساسي (Primary): البنفسجي النيلي #4f46e5 (Indigo)
   2. لون النجاح/التمييز (Success/Accent): الأخضر الزمردي #10b981 (Emerald)
   3. لون التنبيه/الخطأ (Danger): الأحمر الوردي #f43f5e (Rose)
   4. الألوان المحايدة (Neutrals): Slate (#1e293b, #f8fafc) وخلفيات الأبيض والأسود
   ==========================================================================
*/
:root {
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --accent: #10b981;
    --danger: #f43f5e;
    --bg: #f8fafc;
    --bg-card: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --radius: 16px;
    --radius-sm: 10px;
    --tr: .25s ease;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.02);
}
[data-theme=dark] {
    --bg: #0f172a;
    --bg-card: #1e293b;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
    --shadow: none;
    --shadow-lg: none;
}

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    padding-bottom: 60px;
    transition: background var(--tr), color var(--tr);
}

/* TOPBAR */
.topbar {
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
}
[data-theme=dark] .topbar {
    background: rgba(30,41,59,.9);
}
.back-btn-top {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    transition: var(--tr);
}
.back-btn-top:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.theme-btn {
    background: var(--bg-card);
    border: 2px solid var(--border);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: var(--tr);
    color: var(--text);
}
.theme-btn:hover {
    transform: rotate(15deg);
    border-color: var(--primary);
}

.main-wrap {
    max-width: 950px;
    margin: 30px auto;
    padding: 0 20px;
}

/* PRESENTATION PLAYER */
.ppt-player {
    background: #0f172a;
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    aspect-ratio: 16/9;
    box-shadow: var(--shadow-lg);
    border: 4px solid var(--primary);
    display: flex;
    flex-direction: column;
}
.slide-frame {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    padding: 30px 45px;
    text-align: center;
    background: linear-gradient(135deg, #1e1b4b, #311042);
    position: relative;
}
.slide-watermark {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 13px;
    font-weight: 800;
    color: var(--accent);
    background: rgba(16, 185, 129, 0.15);
    padding: 4px 12px;
    border-radius: 100px;
}
.slide-emoji {
    font-size: 64px;
    margin-bottom: 10px;
    animation: bounce 2s infinite;
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}
.slide-title {
    font-size: 32px;
    font-weight: 900;
    color: #f59e0b;
    margin-bottom: 15px;
    font-family: 'Outfit', sans-serif;
}
.slide-body {
    font-size: 20px;
    max-width: 90%;
    line-height: 1.6;
    margin-bottom: 15px;
}

/* SPECIFIC SLIDE TYPE RENDERERS */
.slide-eng-box {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border-left: 5px solid var(--accent);
    padding: 15px 25px;
    border-radius: var(--radius-sm);
    font-family: 'Outfit', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: 15px;
    direction: ltr;
    display: inline-flex;
    align-items: center;
    gap: 12px;
}
.slide-ar-text {
    font-size: 18px;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 15px;
}
.pronunciation-box {
    background: rgba(16, 185, 129, 0.05);
    border: 1px dashed var(--accent);
    border-radius: var(--radius-sm);
    padding: 10px 20px;
    margin-top: 10px;
    font-size: 14px;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* Visual Cards */
.ppt-visual-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 15px 0;
}
.ppt-visual-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-sm);
    padding: 10px;
    width: 100px;
    text-align: center;
}
.ppt-visual-card svg {
    width: 60px;
    height: 60px;
    margin-bottom: 6px;
}
.ppt-visual-card-title {
    font-size: 11px;
    font-weight: bold;
    color: #cbd5e1;
}

/* Quiz styling inside PPT */
.ppt-choices-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 15px;
    width: 80%;
    max-width: 600px;
}
.ppt-choice-btn {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: var(--radius-sm);
    padding: 12px 20px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--tr);
    font-family: 'Outfit', sans-serif;
}
.ppt-choice-btn:hover {
    background: rgba(255,255,255,0.2);
    border-color: var(--primary-light);
}
.ppt-choice-btn.correct {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
}
.ppt-choice-btn.wrong {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
}

/* Survey score mockup */
.survey-mock-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 80%;
    margin: 8px auto;
    background: rgba(255,255,255,0.05);
    padding: 8px 15px;
    border-radius: var(--radius-sm);
}
.survey-mock-btn {
    background: var(--primary);
    border: none;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
}

/* Chores Chant Layout */
.chant-layout {
    font-family: 'Outfit', sans-serif;
    font-size: 18px;
    font-weight: 800;
    background: rgba(255, 255, 255, 0.05);
    border-radius: var(--radius-sm);
    padding: 12px 24px;
    line-height: 1.8;
    text-align: left;
    display: inline-block;
    direction: ltr;
}
.chant-highlight {
    color: var(--accent);
}

/* CONTROLS */
.controls-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 20px;
    box-shadow: var(--shadow);
}
.btn-ppt {
    padding: 8px 18px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    background: var(--primary);
    color: #fff;
    border: none;
    transition: var(--tr);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.btn-ppt:hover {
    background: var(--primary-light);
}
.btn-ppt:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
}

.lesson-selector {
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border);
    font-size: 15px;
    font-weight: 800;
    background: var(--bg-card);
    color: var(--text);
    outline: none;
    cursor: pointer;
}
/* Memory Flip Game inside PPT player */
.memory-card {
    border-radius: var(--radius-sm);
    cursor: pointer;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
    box-shadow: 0 4px 6px rgba(0,0,0,0.15);
}
.memory-card.flipped {
    transform: rotateY(180deg);
}
.memory-card-front, .memory-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    text-align: center;
    border-radius: var(--radius-sm);
}
.memory-card-front {
    background: var(--primary);
    color: #fff;
}
.memory-card-back {
    transform: rotateY(180deg);
}
.memory-card.matched {
    transform: rotateY(180deg);
    cursor: default;
}
.memory-card.matched .memory-card-back {
    background: rgba(16, 185, 129, 0.2) !important;
    border-color: var(--accent) !important;
    color: var(--accent) !important;
}
</style>
</head>

let currentLesson = 0;
let currentSlide = 0;

// Speech synthesis function
function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-US';
        msg.rate = 0.8;
        window.speechSynthesis.speak(msg);
    }
}

// Theme toggler
function tglTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    document.querySelector('.theme-btn').textContent = newTheme === 'dark' ? '☀️' : '🌙';
}

        pron.style.cursor = 'pointer';

        pron.style.cursor = 'pointer';
        pron.addEventListener('click', () => speakText("I vacuum the floor and clean up my room, I go shopping and fold the laundry."));
        dynamicContent.appendChild(pron);
    }

    else if (slide.type === 'phonics_list') {
        // Lesson 7 Slide 3: Phonics (ar, or, er)
        const cardContainer = document.createElement('div');
        cardContainer.className = 'ppt-visual-container';
        
        const targetPhonics = [
            {t: 'c ar 🚗', s: 'car'},
            {t: 'f or k 🍴', s: 'fork'},
            {t: 'teach er 👩‍🏫', s: 'teacher'},
            {t: 'doct or 👨‍⚕️', s: 'doctor'}

            card.style.cursor = 'pointer';

            card.addEventListener('click', () => speakText(item.t.replace(/[^a-zA-Z]/g, '')));

        const pron = document.createElement('div');
        pron.className = 'pronunciation-box';
        pron.innerHTML = `🔊 <b>نصيحة نطق:</b> التركيب ar مفخم /ɑːr/، والتركيب or مضموم /ɔːr/، والتركيب er مرقق خفيف /ər/. اضغط على البطاقات للاستماع.`;
        dynamicContent.appendChild(pron);

    else if (slide.type === 'phonics_challenge') {
        // Lesson 8 Slide 3: Phonics challenge dark/sports/park
        const cardContainer = document.createElement('div');
        cardContainer.className = 'ppt-visual-container';

        const challengeData = [
            {t: 'd ar k 🌃', s: 'dark'},
            {t: 'p ar k 🌳', s: 'park'}

        challengeData.forEach(item => {

            card.style.cursor = 'pointer';

        });

        sentences.style.cssText = "background:rgba(255,255,255,0.06); padding:10px; border-radius:8px; font-size:16px; font-weight:bold; direction:ltr; text-align:left; margin-top:5px;";

          2. He plays <span style="color:#f59e0b;">sports</span> in the <span style="color:#f59e0b;">park</span>.
        `;
        dynamicContent.appendChild(sentences);

        const pron = document.createElement('div');
        pron.className = 'pronunciation-box';
        pron.innerHTML = `🔊 <b>نصيحة نطق:</b> اقرأ الجملة كاملة بشكل متصل: /hi pleɪz spɔːrts ɪn ðə pɑːrk/. اضغط للاستماع للجمل.`;
        pron.style.cursor = 'pointer';
        pron.addEventListener('click', () => speakText("It is dark in winter. He plays sports in the park."));
        dynamicContent.appendChild(pron);
    }

    else if (slide.type === 'quiz') {
        // Render quiz buttons
        const qTitle = document.createElement('div');
        qTitle.style.cssText = "font-family:'Outfit',sans-serif; font-size:22px; font-weight:bold; margin-bottom:10px; color:#f59e0b; direction:ltr;";
        qTitle.textContent = slide.q;
        dynamicContent.appendChild(qTitle);

        const grid = document.createElement('div');
        grid.className = 'ppt-choices-grid';
        
        slide.choices.forEach((choice, idx) => {
            const btn = document.createElement('button');
            btn.className = 'ppt-choice-btn';
            btn.textContent = choice;
            btn.addEventListener('click', () => handleQuizClick(btn, idx, slide.correct));
            grid.appendChild(btn);
        });
        dynamicContent.appendChild(grid);
    }
}

function handleQuizClick(btnEl, selectedIdx, correctIdx) {
    // Disable all choice buttons to prevent multiple clicks
    const buttons = document.querySelectorAll('.ppt-choice-btn');
    buttons.forEach(btn => btn.disabled = true);

    if (selectedIdx === correctIdx) {
        btnEl.classList.add('correct');
        speakText("Correct!");
        popConfetti();
    } else {
        btnEl.classList.add('wrong');
        // highlight correct one
        buttons[correctIdx].classList.add('correct');
        speakText("Incorrect. Let's learn from this!");
    }
}

function popConfetti() {
    if (typeof confetti === 'function') {
        confetti({
            particleCount: 80,
            spread: 50,
            origin: { y: 0.6 }
        });
    }
}

// Chores Survey calculator for presentation slide
function calcPptSurvey() {
    let score = 0;
    let answered = 0;
    for(let i=0; i<3; i++) {
        const radios = document.getElementsByName(`ppt-chore-${i}`);
        for(let r of radios) {
            if(r.checked) {
                score += parseInt(r.value);
                answered++;
            }
        }
    }
    const scoreVal = document.getElementById("ppt-survey-val");
    const scoreStatus = document.getElementById("ppt-survey-status");
    if(scoreVal) scoreVal.textContent = score;
    if(scoreStatus) {
        if(score >= 5) {
            scoreStatus.style.color = "var(--accent)";
            scoreStatus.textContent = "🏆 Great Helper! (مساعد رائع)";
            popConfetti();
        } else if(score >= 3) {
            scoreStatus.style.color = "var(--primary-light)";
            scoreStatus.textContent = "👍 Good Helper! (مساعد جيد)";
        } else if(score >= 1) {
            scoreStatus.style.color = "#f59e0b";
            scoreStatus.textContent = "😐 Average Helper (مساعد متوسط)";
        } else {
            scoreStatus.style.color = "var(--danger)";
            scoreStatus.textContent = "😢 Poor Helper (بحاجة للمساعدة)";
        }
    }
}

// Memory Match Game inside PPT slide player
let pptFirstCard = null;
let pptSecondCard = null;
let pptMatchedCount = 0;

function startPptMemoryGame() {
    const arena = document.getElementById("ppt-memory-arena");
    const fb = document.getElementById("ppt-memory-fb");
    if(!arena) return;
    arena.innerHTML = "";
    if(fb) fb.textContent = "";
    
    const pairs = [
        { text: "feed fish", match: "🐠 أطعم السمك" },
        { text: "set table", match: "🍽️ أجهز المائدة" },
        { text: "wash dishes", match: "🧽 أغسل الأطباق" },
        { text: "fold laundry", match: "🧺 أطوي الغسيل" }
    ];
    
    let items = [];
    pairs.forEach(p => {
        items.push({ id: p.text, val: p.text });
        items.push({ id: p.text, val: p.match });
    });
    
    // Shuffle
    items.sort(() => Math.random() - 0.5);
    
    pptFirstCard = null;
    pptSecondCard = null;
    pptMatchedCount = 0;
    
    items.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "memory-card";
        card.style.height = "52px";
        card.dataset.id = item.id;
        card.onclick = () => flipPptCard(card);
        card.innerHTML = `
            <div class="memory-card-front" style="font-size:18px;">?</div>
            <div class="memory-card-back" style="font-size:10px; background:#1e293b; color:#fff; border:1px solid var(--primary-light);">${item.val}</div>
        `;
        arena.appendChild(card);
    });
}

function flipPptCard(card) {
    if(card.classList.contains("flipped") || card.classList.contains("matched")) return;
    if(pptFirstCard && pptSecondCard) return;
    
    card.classList.add("flipped");
    speakText(card.dataset.id);
    
    if(!pptFirstCard) {
        pptFirstCard = card;
    } else {
        pptSecondCard = card;
        if(pptFirstCard.dataset.id === pptSecondCard.dataset.id) {
            setTimeout(() => {
                pptFirstCard.classList.add("matched");
                pptSecondCard.classList.add("matched");
                pptFirstCard = null;
                pptSecondCard = null;
                pptMatchedCount++;
                
                speakText("Correct!");
                popConfetti();
                
                if(pptMatchedCount === 4) {
                    const fb = document.getElementById("ppt-memory-fb");
                    if(fb) fb.textContent = "🎉 أحسنت! تم حل لعبة الذاكرة بنجاح!";
                }
            }, 500);
        } else {
            setTimeout(() => {
                pptFirstCard.classList.remove("flipped");
                pptSecondCard.classList.remove("flipped");
                pptFirstCard = null;
                pptSecondCard = null;
            }, 1000);
        }
    }
}

function navigateSlide(dir) {
    let nextSlide = currentSlide + dir;
    if (nextSlide >= 0 && nextSlide < 5) {
        currentSlide = nextSlide;
        renderSlide();
    }
}

function changeLesson() {
    currentLesson = parseInt(document.getElementById('l-select').value);
    currentSlide = 0;
    renderSlide();
}

// --------------------------------------------------------------------------
// POWERPOINT EXPORT (PPTX) USING PPTXGENJS
// --------------------------------------------------------------------------
function exportPPTX() {
    if (typeof PptxGenJS === 'undefined') {
        alert("⚠️ عذراً، لم تكتمل عملية تحميل مكتبة تصدير PowerPoint من شبكة توزيع المحتوى (CDN) بعد. يرجى التأكد من اتصالك بالإنترنت ثم المحاولة مرة أخرى.");
        return;
    }
    let pptx = new PptxGenJS();
    pptx.layout = 'LAYOUT_16x9';
    
    const slides = slidesData[currentLesson];
    slides.forEach((s, idx) => {
        let slide = pptx.addSlide();
        
        // Background color fill: Indigo Navy
        slide.background = { fill: '1E1B4B' };
        
        // Add watermark
        slide.addText("SmartLearning - We Can 3", {
            x: 0.3, y: 0.2, w: 4.0, h: 0.4,
            fontSize: 12, bold: true, color: '10B981',
            fontFace: 'Arial'
        });

        // Emojis / icon indicator
        slide.addText(s.em || '🧹', {
            x: 0.5, y: 0.8, w: 1.0, h: 1.0,
            fontSize: 48, align: 'center'
        });

        // Slide Title (translated)
        slide.addText(s.t, {
            x: 1.5, y: 0.8, w: 11.0, h: 1.0,
            fontSize: 28, bold: true, color: 'F59E0B',
            align: 'right', fontFace: 'Arial'
        });
        
        // Main content body (English)
        let bodyText = s.b || "";
        if (s.type === 'quiz') {
            bodyText = `Question: ${s.q}\nChoices:\n` + s.choices.map((c, i) => `   [${i+1}] ${c}`).join('\n');
        }
        
        slide.addText(bodyText, {
            x: 1.0, y: 2.2, w: 11.3, h: 1.8,
            fontSize: 20, color: 'FFFFFF',
            align: 'center', fontFace: 'Arial',
            lineSpacing: 28
        });

        // Arabic translation text at the bottom
        let arText = s.ar || "";
        slide.addText(arText, {
            x: 1.0, y: 4.2, w: 11.3, h: 1.2,
            fontSize: 16, color: '38BDF8',
            align: 'center', fontFace: 'Arial',
            rtl: true
        });
    });
    
    pptx.writeFile({ fileName: `WeCan3-Grade3-Unit4-Lesson-${currentLesson + 1}.pptx` });
}

// Initial render
renderSlide();
